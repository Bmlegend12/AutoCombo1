name: Build DEB Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl libssl-dev
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -sL https://raw.githubusercontent.com/theos/sdks/master/iPhoneOS14.5.sdk.tar.xz | tar -xJ -C $HOME/theos/sdks

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          $THEOS/bin/make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUHelperPatch-DEB
          path: packages/*.deb
