name: Build DEB Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Setup Theos
        run: |
          # Cài đặt ldid để ký file deb
          brew install ldid
          
          # Clone Theos và SDK
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          
          # Cấu hình biến môi trường
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build Package
        run: |
          make package FINALPACKAGE=1 TARGET=iphone:clang:latest:14.0

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUHelperPatch-DEB
          path: packages/*.deb
