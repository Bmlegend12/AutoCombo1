- name: Install Dependencies & Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl libssl-dev clang llvm
          
          # Tải cctools-port cho Linux để hỗ trợ cross-compile iOS
          git clone https://github.com/tpoechtrager/cctools-port.git
          
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
